<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>승인함 390</title>
<link rel="stylesheet" href="../src/styles.css">
<body style="width:390px;margin:0">
<section class="panel" aria-labelledby="owner-inbox-title">
  <header class="panel-header"><h2 id="owner-inbox-title">승인함</h2></header>
  <div class="panel-body">
    <ul class="record-list">
      <li class="record">
        <p class="record-title">외부: mail.send, payment — 세금계산서와 대금</p>
        <ol class="batch-list" data-batch="true">
          <li><span>mail.send</span> 세금계산서 초안을 거래처에 보냅니다</li>
          <li><span>payment</span> 같은 건의 대금을 보냅니다</li>
        </ol>
        <p class="record-meta">외부 실행 승인</p>
        <button type="button">승인</button>
        <button type="button">거절</button>
      </li>
    </ul>
  </div>
</section>
</body>
</html>
